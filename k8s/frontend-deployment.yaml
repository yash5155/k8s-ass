apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-deployment
  namespace: k8s-assignment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: yashhuu/k8s-frontend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          env:
            - name: FLASK_BACKEND_URL
              value: "http://backend:5000"